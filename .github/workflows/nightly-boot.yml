name: Nightly boot

# Boot a Debian cloud image with quark-de and the real Quark app installed, autologin through greetd,
# and check Quark comes up fullscreen and focused on 1:quark. Slow; not a required PR check.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      quark-tag:
        description: Quark release tag to boot (default latest)
        required: false
        default: latest

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Let the runner user open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
      - name: Download Quark
        id: quark
        env:
          GH_TOKEN: ${{ github.token }}
          QUARK_TAG: ${{ inputs.quark-tag || 'latest' }}
        run: echo "appimage=$(sh tests/boot/fetch-quark.sh "$RUNNER_TEMP/quark" "$QUARK_TAG")" >>"$GITHUB_OUTPUT"
      - name: Boot and check the session
        env:
          APPIMAGE: ${{ steps.quark.outputs.appimage }}
        run: sh tests/boot/run.sh "$APPIMAGE" "$RUNNER_TEMP/boot"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-boot
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/boot/shot.png
            ${{ runner.temp }}/boot/tree.json
            ${{ runner.temp }}/boot/views.txt
            ${{ runner.temp }}/boot/journal.txt
            ${{ runner.temp }}/boot/session-logs.txt
            ${{ runner.temp }}/boot/provision.log
            ${{ runner.temp }}/boot/serial.log

  report:
    needs: boot
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly boot smoke test is failing"
          body="The nightly QEMU boot did not reach a working Quark desktop: $RUN_URL (screenshot, journal and sway tree are in the nightly-boot artifact)."
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
