name: Bug Report
description: File a bug report.
title: "[Bug] "
labels: ["bug"]
projects: ["autobutler-org/2"]
type: Bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: What component(s) are affected by this?
      multiple: true
      options:
        - N/A
        - Session / launcher
        - Workspaces / keybinds
        - Quark integration
        - Install / packaging
      default: 0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also, what did you expect to happen?
      placeholder: What is going on? 🔫
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and sway version
      description: e.g. output of `. /etc/os-release; echo $PRETTY_NAME; sway --version`
  - type: input
    id: version
    attributes:
      label: Quark DE version
      description: Which quark-de commit or release are you running?
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
